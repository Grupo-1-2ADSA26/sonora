<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sonora. | LOGIN</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/home/header-footer.css">
    <link rel="stylesheet" href="./css/home/login.css">
    
    <link rel="icon" href="assets/logos-sonora/play-icon.png">
</head>

<body>

    <!-- Header / Navbar -->
    <header class="header">
        <div class="container header-container">
            <h1 class="logo">sonora.</h1>
            <nav>
                <ul class="navbar">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="index.html">MISSÃO</a></li>
                    <li><a href="index.html">CONTATO</a></li>
                    <li><a href="cadastro.html">CADASTRO</a></li>
                    <li><a href="login.html" class="ativo">LOGIN</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- banner login -->

    <section class="secao-login">
        <div class="login-esquerda">
            <div class="conteudo-esquerda">
                <h1 class="logo-login">sonora.</h1>
                <div class="player-widget">
                    <img src="assets/logos-sonora/barra-branca.png" alt="Barra de Progresso" class="img-progress-bar">
                </div>
            </div>
        </div>
        
        <div class="login-direita">
            <img src="assets/icons-sonora/disco-cortado-esquerda.png" alt="Disco" class="img-disco">
            
            <div class="container-formulario">
                <h2 class="titulo-login">LOGIN</h2>
                
                <div class="alerta_erro">
                    <div class="card_erro" id="cardErro">
                        <span id="mensagem_erro"></span>
                    </div>
                </div>

                <input type="text" id="email_input" placeholder="e-mail" class="input-escuro">
                
                <div class="wrapper-senha">
                    <input type="password" id="senha_input" placeholder="senha" class="input-escuro">
                </div>
                
                <button onclick="entrar()" class="btn-entrar">ENTRAR</button>

                <span class="texto-cadastro">Não tem conta? <a href="cadastro.html">CLIQUE AQUI</a></span>
            </div>
        </div>
    </section>

    <!-- fim banner login :) -->

    <footer class="footer">
        <div class="container footer-container">
            
            <div class="footer-info">
                <p><img src="assets/icons-sonora/local-icon.png" alt="Endereço" class="icon-footer"> Rua Hadock Lobo</p>
                <p><img src="assets/icons-sonora/telefone-icon.png" alt="Telefone" class="icon-footer"> (11) 99999-9999</p>
                <p><img src="assets/icons-sonora/rede-icon.png" alt="Website" class="icon-footer"> www.sonora.com.br</p>
                <p><img src="assets/icons-sonora/email-icon.png" alt="E-mail" class="icon-footer"> sonora@gmail.com</p>
            </div>

            <div class="footer-logo">
                <h2>sonora.</h2>
                <div class="player-widget-sm">
                    <img src="assets\logos-sonora\barra-preta.png" alt="Barra de Progresso Pequena" class="img-progress-bar-sm">
                </div>
            </div>

            <div class="footer-decoracao">
                <img src="assets/icons-sonora/elemento-icon.png" alt="Textura Sonora" class="img-textura-footer">
            </div>

        </div>
    </footer>

</body>

</html>

<script>

    function entrar() {

        var email = email_input.value;
        var senha = senha_input.value;

        if (email == "" || senha == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            return null;
        }

        console.log("FORM LOGIN: ", email);
        console.log("FORM SENHA: ", senha);

        fetch("/empresas/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        }).then(function (resposta) {
            
            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log("Log: Estou na tela de login na função entrar e a resposta está ok!");
                    console.log(JSON.stringify(json));
                    sessionStorage.ID_EMPRESA = json.id_empresa;
                    sessionStorage.NOME_EMPRESA = json.nome_empresa;

                    setTimeout(function () {
                        window.location = "index.html";
                    }, 1000);

                });

            } else {
                console.log("Log Error: Estou na tela de login na função entrar e houve um erro ao tentar realizar o login!");
                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log("Log Error: Estou na tela de login na função entrar e houve um erro ao tentar realizar o fetch!");
            console.log(erro);
        })

        return null;
    }


</script>
