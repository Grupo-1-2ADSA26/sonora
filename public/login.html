<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sonora. | LOGIN</title>



    <link rel="stylesheet" href="./css/home/header-footer.css">
    <link rel="stylesheet" href="./css/home/login.css">
    
    <link rel="icon" href="assets/logos-sonora/play-icon.png">
</head>

<body>

    <!-- Header / Navbar -->
    <header class="header">
        <div class="container header-container">
            <h1 class="logo">sonora.</h1>
            <nav>
                <ul class="navbar">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="index.html">MISSÃO</a></li>
                    <li><a href="index.html">CONTATO</a></li>
                    <li><a href="cadastro.html">CADASTRO</a></li>
                    <li><a href="login.html" class="ativo">LOGIN</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- banner login -->

    <section class="secao-login">
        <div class="login-esquerda">
            <div class="conteudo-esquerda">
                <h1 class="logo-login">sonora.</h1>
                <div class="player-widget">
                    <img src="assets/logos-sonora/barra-branca.png" alt="Barra de Progresso" class="img-progress-bar">
                </div>
            </div>
        </div>
        
        <div class="login-direita">
            <img src="assets/icons-sonora/disco-cortado-esquerda.png" alt="Disco" class="img-disco">
            
            <div class="container-formulario">
                <h2 class="titulo-login">LOGIN</h2>
                
                <div class="alerta_erro">
                    <div class="card_erro" id="cardErro">
                        <span id="mensagem_erro"></span>
                    </div>
                </div>

                <input type="text" id="email_input" placeholder="e-mail" class="input-escuro">
                
                <div class="wrapper-senha">
                    <input type="password" id="senha_input" placeholder="senha" class="input-escuro">
                </div>
                
                <button onclick="entrar()" class="btn-entrar">ENTRAR</button>

                <span class="texto-cadastro">Não tem conta? <a href="cadastro.html">CLIQUE AQUI</a></span>
            </div>
        </div>
    </section>

    <!-- fim banner login :) -->

    <footer class="footer">
        <div class="container footer-container">
            
            <div class="footer-info">
                <p><img src="assets/icons-sonora/local-icon.png" alt="Endereço" class="icon-footer"> Rua Hadock Lobo</p>
                <p><img src="assets/icons-sonora/telefone-icon.png" alt="Telefone" class="icon-footer"> (11) 99999-9999</p>
                <p><img src="assets/icons-sonora/rede-icon.png" alt="Website" class="icon-footer"> www.sonora.com.br</p>
                <p><img src="assets/icons-sonora/email-icon.png" alt="E-mail" class="icon-footer"> sonora@gmail.com</p>
            </div>

            <div class="footer-logo">
                <h2>sonora.</h2>
                <div class="player-widget-sm">
                    <img src="assets\logos-sonora\barra-preta.png" alt="Barra de Progresso Pequena" class="img-progress-bar-sm">
                </div>
            </div>

            <div class="footer-decoracao">
                <img src="assets/icons-sonora/elemento-icon.png" alt="Textura Sonora" class="img-textura-footer">
            </div>

        </div>
    </footer>

</body>

</html>

<script>

    async function registrarLog(tipo, mensagem, status) {
        try {
            await fetch("/suporte/registrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    tipo: tipo,
                    mensagem: mensagem,
                    status: status
                })
            });
        } catch (erro) {
            console.error("Erro ao registrar log:", erro);
        }
    }


    function entrar() {
        var email = email_input.value.trim();
        var senha = senha_input.value;

        if (email == "" || senha == "") {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Preencha todos os campos para prosseguir!";
            registrarLog(
                "Falha",
                "Tentativa de login sem preenchimento de todos os campos. E-mail informado: " + (email || "não informado"),
                "Crítico"
            );
            return false;
        }

        console.log("FORM LOGIN: ", email);
        
        var inicioRequisicao = performance.now();

        fetch("/funcionario/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        }).then(function (resposta) {

            var tempoResposta = performance.now() - inicioRequisicao;

            if (tempoResposta > 3000) {
                registrarLog(
                    "Atraso",
                    "Login demorou " + Math.round(tempoResposta) + "ms para responder. E-mail: " + email,
                    "Atenção"
                );
            }

            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log("Login realizado com sucesso:", json);
                    registrarLog(
                        "Sistema",
                        "Login realizado com sucesso. E-mail: " + email + ". Usuário: " + json.id_usuario,
                        "Informação"
                    );

                    // Armazena as informações no sessionStorage
                    sessionStorage.ID_USUARIO = json.id_usuario;
                    sessionStorage.NOME_USUARIO = json.nome_usuario;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.ID_EMPRESA = json.id_empresa;
                    sessionStorage.NOME_EMPRESA = json.nome_empresa;
                    sessionStorage.ID_CARGO = json.id_cargo;
                    sessionStorage.NOME_CARGO = json.nome_cargo;

                    // Redirecionamento baseado no perfil
                    setTimeout(function () {

                        if (json.id_cargo == 1) {
                            window.location.href = "./empresa/dashboard.html";

                        } else if (json.id_cargo == 2) {
                            window.location.href = "./funcionario/dashboard.html";

                        } else if (json.id_cargo == 3) {
                            window.location.href = "./suporte/logs.html";

                        } else {
                            window.location.href = "index.html";
                        }

                    }, 1000);
                });

            } else {
                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    registrarLog(
                        "Falha",
                        "Tentativa de login com credenciais inválidas. E-mail informado: " + email,
                        "Crítico"
                    );
                    cardErro.style.display = "block";
                    mensagem_erro.innerHTML = texto || "E-mail ou senha inválidos!";
                });
            }

        }).catch(function (erro) {
            console.error("Erro na requisição Fetch: ", erro);
            registrarLog(
                "Integração",
                "Falha na comunicação com o serviço de autenticação. E-mail: " + email,
                "Crítico"
            );

            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Erro de conexão com o servidor!";
        });

        return false;
    }

</script>
