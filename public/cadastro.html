<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sonora. | Cadastro</title>

    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/home/header-footer.css">
    <link rel="stylesheet" href="./css/home/cadastro.css">
    
    <link rel="icon" href="assets/logos-sonora/play-icon.png">
</head>

<body>

    <!-- Header / Navbar -->
    <header class="header">
        <div class="container header-container">
            <h1 class="logo">sonora.</h1>
            <nav>
                <ul class="navbar">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="index.html">MISSÃO</a></li>
                    <li><a href="index.html">CONTATO</a></li>
                    <li><a href="cadastro.html"  class="ativo">CADASTRO</a></li>
                    <li><a href="login.html">LOGIN</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="secao-cadastro">
        <div class="cadastro-esquerda">
            <img src="assets/icons-sonora/disco-cortado-direita.png" alt="Disco" class="img-disco-direita">
            
            <div class="container-formulario">
                <h2 class="titulo-cadastro">CADASTRO</h2>
                
                <div class="alerta_erro">
                    <div class="card_erro" id="cardErro">
                        <span id="mensagem_erro"></span>
                    </div>
                </div>

                <input id="razao_social_input" type="text" placeholder="Razão Social" maxlength="100" required class="input-escuro" />
                <input id="email_responsavel_input" type="email" placeholder="E-mail do responsável" maxlength="150" required class="input-escuro"/>
                <input id="cnpj_input" type="text" placeholder="00.000.000/0000-00" inputmode="numeric" maxlength="18" required class="input-escuro" oninput="mascaraCnpj(this)" />
                <select id="tipo_empresa_input" required class="input-escuro">
                    <option value="" selected disabled>Selecione o tipo de estabelecimento</option>
                    <option value="Casa de Shows">Casa de Shows</option>
                    <option value="Festival">Festival</option>
                    <option value="Teatro">Teatro</option>
                    <option value="Balada / Casa Noturna">Balada / Casa Noturna</option>
                    <option value="Bar com Música ao Vivo">Bar com Música ao Vivo</option>
                </select> 
                <button id="btn_cadastrar" onclick="cadastrar()" class="btn-cadastrar">CADASTRAR</button>
                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif" />
                </div>
                <div id="div_erros_login"></div>
                <span class="texto-login">Já tem conta? <a href="login.html">CLIQUE AQUI</a></span>
            </div>
        </div>

        <div class="cadastro-direita">
            <div class="conteudo-direita">
                <h1 class="logo-cadastro">sonora.</h1>
                <div class="player-widget">
                    <img src="assets/logos-sonora/barra-branca.png" alt="Barra de Progresso" class="img-progress-bar">
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-container">
            
            <div class="footer-info">
                <p><img src="assets/icons-sonora/local-icon.png" alt="Endereço" class="icon-footer"> Rua Hadock Lobo</p>
                <p><img src="assets/icons-sonora/telefone-icon.png" alt="Telefone" class="icon-footer"> (11) 99999-9999</p>
                <p><img src="assets/icons-sonora/rede-icon.png" alt="Website" class="icon-footer"> www.sonora.com.br</p>
                <p><img src="assets/icons-sonora/email-icon.png" alt="E-mail" class="icon-footer"> sonora@gmail.com</p>
            </div>

            <div class="footer-logo">
                <h2>sonora.</h2>
                <div class="player-widget-sm">
                    <img src="assets/logos-sonora/barra-preta.png" alt="Barra de Progresso Pequena" class="img-progress-bar-sm">
                </div>
            </div>

            <div class="footer-decoracao">
                <img src="assets/icons-sonora/elemento-icon.png" alt="Textura Sonora" class="img-textura-footer">
            </div>

        </div>
    </footer>

    <script>
        const TIPOS_ESTABELECIMENTO = [
            "Casa de Shows",
            "Festival",
            "Teatro",
            "Balada / Casa Noturna",
            "Bar com Música ao Vivo"
        ];

        function mascaraCnpj(input) {
            let v = input.value.replace(/\D/g, '').slice(0, 14);

            v = v.replace(/^(\d{2})(\d)/, '$1.$2');
            v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
            v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
            v = v.replace(/(\d{4})(\d)/, '$1-$2');

            input.value = v;
        }

        function mostrarMensagem(texto) {
            document.getElementById("cardErro").style.display = "block";
            document.getElementById("mensagem_erro").textContent = texto;
        }

        function esconderMensagem() {
            document.getElementById("cardErro").style.display = "none";
            document.getElementById("mensagem_erro").textContent = "";
        }

        function carregando(ativo) {
            document.getElementById("div_aguardar").style.display =
                ativo ? "block" : "none";

            document.getElementById("btn_cadastrar").disabled = ativo;
        }

        function validar(razaoSocial, cnpj, tipo, email) {
            if (razaoSocial === "" || cnpj === "" || tipo === "" || email === "") {
                return "Preencha todos os campos!";
            }
            if (razaoSocial.length < 3) {
                return "A razão social precisa ter pelo menos 3 caracteres.";
            }
            if (razaoSocial.length > 100) {
                return "A razão social pode ter no máximo 100 caracteres.";
            }
            if (cnpj.length !== 14) {
                return "O CNPJ deve ter 14 dígitos.";
            }
            if (!email.includes("@") || email.indexOf("@") !== email.lastIndexOf("@") || !email.split("@")[1].includes(".")) {
                return "Digite um e-mail válido.";
            }
            if (!TIPOS_ESTABELECIMENTO.includes(tipo)) {
                return "Selecione um tipo de estabelecimento válido.";
            }
            return null;
        }

        
        function cadastrar() {
            const razaoSocial = razao_social_input.value.trim();
            const cnpj = cnpj_input.value.replace(/\D/g, ''); // sem máscara
            const tipo = tipo_empresa_input.value;
            const email = email_responsavel_input.value;

            const erro = validar(razaoSocial, cnpj, tipo, email);

            if (erro) {
                mostrarMensagem(erro);
                return;
            }

            esconderMensagem();
            carregando(true);

            fetch("/empresa/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    razaoSocialServer: razaoSocial,
                    cnpjServer: cnpj,
                    tipoServer: tipo,
                    emailResponsavelServer: email
                }),
            }).then(function (resposta) {
                    console.log("Log: tela de cadastro, resposta: ", resposta);
                    if (resposta.ok) {
                        mostrarMensagem("Cadastro realizado com sucesso! Verifique seu email para realizar o cadastro de seu primeiro administrador");
                        return;
                    } else {
                        throw new Error("Houve um erro ao tentar realizar o cadastro. Tente novamente.");
                    }
                })
                .catch(function (e) {
                    console.log("Log Error: tela de cadastro, erro: ", e);
                    mostrarMensagem("Não foi possível conectar ao servidor.");
                    carregando(false);
                })
                .finally(function () {
                    carregando(false);
                });
        }
    </script>
</body>

</html>
