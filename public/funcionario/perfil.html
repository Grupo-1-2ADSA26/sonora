<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Funcionário | Sonora</title>
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/funcionario/perfil.css">
</head>

<body>

    <aside class="box-menu">
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <div class="menu-top">
            <label for="menu-toggle" class="btn-hamburguer"><i class="fa-solid fa-bars"></i></label>
            <p class="logo">sonora.</p>

        </div>
        <ul class="lista">
            <li class="ativo"><a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Início</span></a></li>
            <li><a href="pesquisa.html"><i class="fa-solid fa-magnifying-glass"></i><span>Artistas</span></a></li>
            <li><a href="recomendacoes.html"><i class="fa-solid fa-music"></i><span>Recomendações</span></a></li>
            <li><a href="aprovados.html"><i class="fa-solid fa-bell"></i><span>Aprovados</span></a></li>
            <li><a href="perfil.html"><i class="fa-solid fa-user"></i><span>Perfil</span></a></li>
            <li class="box-sair">
                <a class="botao-sair" href="../index.html"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="cabecalho-pagina">
            <div class="cabecalho-info">
                <span class="sobretitulo">SONORA / MEU PERFIL</span>

                <h1>Perfil do funcionário</h1>

                <p>
                    Consulte e atualize seus dados de acesso.
                </p>
            </div>
        </header>

        <div class="profile-container">
            <section class="profile-card">

                <form class="profile-form" onsubmit="atualizarPerfil(event)">

                    <div class="field-group">
                        <label><i class="fa-solid fa-address-card"></i> Nome: <input type="text" id="input-nome"
                                placeholder="Seu nome"></label>
                    </div>

                    <div class="field-group">
                        <label><i class="fa-solid fa-lock"></i> Senha</label>
                        <div class="password-box">
                            <input type="password" id="input-senha" placeholder="Sua senha" required>
                            <i class="fa-solid fa-eye" id="toggle-senha" title="Mostrar/Ocultar Senha"></i>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <i class="fa-solid fa-floppy-disk"></i> Salvar
                        </button>
                        <button type="button" class="btn-danger" onclick="excluirPerfil()">
                            <i class="fa-solid fa-trash-can"></i> Excluir
                        </button>
                    </div>

                </form>

            </section>
        </div>

    </main>

    <script>
        const inputNome = document.getElementById('input-nome');
        const inputSenha = document.getElementById('input-senha');
        const toggleSenha = document.getElementById('toggle-senha');


        toggleSenha.addEventListener('click', () => {
            const isPassword = inputSenha.type === 'password';
            inputSenha.type = isPassword ? 'text' : 'password';
            toggleSenha.classList.toggle('fa-eye', !isPassword);
            toggleSenha.classList.toggle('fa-eye-slash', isPassword);
        });

        window.onload = function () {
            carregarPerfil();
        };

        function carregarPerfil() {
            const idUsuario = sessionStorage.ID_USUARIO || 2;

            fetch(`/funcionario/perfil/${idUsuario}`)
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (usuario) {
                            console.log("Perfil carregado:", usuario);

                            inputNome.value = usuario.nome;

                            sessionStorage.EMAIL_USUARIO = usuario.email;
                            sessionStorage.ID_CARGO = usuario.id_cargo;

                            inputSenha.value = "";
                            inputSenha.placeholder = "Digite sua senha para manter como a atual";
                        });
                    } else {
                        console.error("Erro ao carregar os dados do perfil.");
                    }
                })
                .catch(function (erro) {
                    console.error("Erro de conexão com o servidor:", erro);
                });
        }

        function atualizarPerfil(event) {
            event.preventDefault(); // Evita o reload padrão do formulário
            const idUsuario = sessionStorage.ID_USUARIO || 2;

            const nomeVar = inputNome.value;
            const senhaVar = inputSenha.value;
            const emailVar = sessionStorage.EMAIL_USUARIO;
            const idCargoVar = sessionStorage.ID_CARGO;

            fetch(`/funcionario/atualizar/${idUsuario}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: nomeVar,
                    email: emailVar,
                    senha: senhaVar,
                    idCargo: idCargoVar
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    alert("Perfil atualizado com sucesso!");
                    window.location.reload();
                } else {
                    alert("Houve um erro ao tentar atualizar o perfil!");
                }
            }).catch(function (erro) {
                console.error("Erro:", erro);
            });
        }

        function excluirPerfil() {
            const idUsuario = sessionStorage.ID_USUARIO || 2;

            if (confirm("Tem certeza de que deseja excluir a sua conta?")) {
                fetch(`/funcionario/deletar/${idUsuario}`, {
                    method: "DELETE",
                    headers: {
                        "Content-Type": "application/json"
                    }
                }).then(function (resposta) {
                    if (resposta.ok) {
                        alert("Conta excluída com sucesso!");
                        sessionStorage.clear();
                        window.location.href = "../index.html";
                    } else {
                        alert("Houve um erro ao tentar excluir a conta!");
                    }
                }).catch(function (erro) {
                    console.error("Erro:", erro);
                });
            }
        }
    </script>

</body>

</html>
