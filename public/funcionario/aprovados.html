<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Empresa | Sonora</title>
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/funcionario/aprovados.css">
</head>

<body>

    <aside class="box-menu">
        <p class="logo">sonora.</p>
        <ul class="lista">
            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i>Início</a></li>
            <li><a href="pesquisa.html"><i class="fa-solid fa-magnifying-glass"></i>Artistas</a></li>
            <li><a href="recomendacoes.html"><i class="fa-solid fa-music"></i>Recomendações</a></li>
            <li class="ativo"><a href="aprovados.html"><i class="fa-solid fa-bell"></i>Aprovados</a></li>
            <li><a href="perfil.html"><i class="fa-solid fa-user"></i>Perfil</a></li>
        </ul>
        <div class="box-sair">
            <a class="botao-sair" href="../index.html"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
        </div>
    </aside>

    <main class="main-content">

        <header class="page-header">
            <h1>ARTISTAS APROVADOS</h1>
        </header>

        <section class="approved-list">
            
            <article class="approved-card">
                <div class="approved-avatar">
                    <i class="fa-solid fa-microphone"></i>
                </div>

                <div class="approved-info">
                    <h2>Anitta <i class="fa-solid fa-circle-check"></i></h2>
                    <span>Pop • Funk • Reggaeton</span>
                </div>

                <div class="approved-metrics">
                    <div class="approved-metric">
                        <small>Popularidade</small>
                        <strong>92</strong>
                    </div>

                    <div class="approved-metric">
                        <small>Energy</small>
                        <strong>0.82</strong>
                    </div>

                    <div class="approved-metric">
                        <small>Danceability</small>
                        <strong>0.88</strong>
                    </div>

                    <div class="approved-metric">
                        <small>BPM</small>
                        <strong>130</strong>
                    </div>
                </div>

                <div class="approved-status">
                    <i class="fa-solid fa-check"></i>
                    Aprovado
                </div>

                <button class="approved-button">
                    Ver análise
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </article>

            <article class="approved-card">
                <div class="approved-avatar">
                    <i class="fa-solid fa-microphone"></i>
                </div>

                <div class="approved-info">
                    <h2>Jão <i class="fa-solid fa-circle-check"></i></h2>
                    <span>Pop • Indie Pop</span>
                </div>

                <div class="approved-metrics">
                    <div class="approved-metric">
                        <small>Popularidade</small>
                        <strong>87</strong>
                    </div>

                    <div class="approved-metric">
                        <small>Energy</small>
                        <strong>0.71</strong>
                    </div>

                    <div class="approved-metric">
                        <small>Danceability</small>
                        <strong>0.69</strong>
                    </div>

                    <div class="approved-metric">
                        <small>BPM</small>
                        <strong>118</strong>
                    </div>
                </div>

                <div class="approved-status">
                    <i class="fa-solid fa-check"></i>
                    Aprovado
                </div>

                <button class="approved-button">
                    Ver análise
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </article>

        </section>

    </main>

</body>
</html>
