<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprovados | Sonora</title>
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/funcionario/aprovados.css">
</head>

<body>

    <aside class="box-menu">
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <div class="menu-top">
            <label for="menu-toggle" class="btn-hamburguer"><i class="fa-solid fa-bars"></i></label>
            <p class="logo">sonora.</p>
        </div>
        <ul class="lista">
            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Início</span></a></li>
            <li><a href="pesquisa.html"><i class="fa-solid fa-magnifying-glass"></i><span>Artistas</span></a></li>
            <li><a href="recomendacoes.html"><i class="fa-solid fa-music"></i><span>Recomendações</span></a></li>
            <li class="ativo"><a href="aprovados.html"><i class="fa-solid fa-bell"></i><span>Aprovados</span></a></li>
            <li><a href="perfil.html"><i class="fa-solid fa-user"></i><span>Perfil</span></a></li>
            <li class="box-sair">
                <a class="botao-sair" href="../index.html"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="cabecalho-pagina">
            <div class="cabecalho-info">
                <span class="sobretitulo">SONORA / APROVADOS</span>
                <h1>Artistas aprovados</h1>
                <p>Confira os artistas aprovados para a sua empresa.</p>
            </div>
        </header>

        <section class="approved-list" id="feed-aprovados">
        </section>
    </main>

    <script>
        window.onload = function () {
            carregarArtistasAprovados();
        };

        function carregarArtistasAprovados() {
            var idEmpresa = sessionStorage.ID_EMPRESA;

            if (!idEmpresa) {
                idEmpresa = 1; // Fallback caso não esteja logado
            }

            fetch(`/aprovados/aprovados/${idEmpresa}`)
                .then(function (resposta) {
                    if (resposta.ok) {
                        if (resposta.status == 204) {
                            document.getElementById("feed-aprovados").innerHTML =
                                '<p class="mensagem-vazia">Nenhum artista aprovado no momento.</p>';
                            return;
                        }

                        resposta.json().then(function (artistas) {
                            var feed = document.getElementById("feed-aprovados");
                            feed.innerHTML = ""; 

                            artistas.forEach(function (item) {
                                feed.innerHTML += `
                                    <article class="approved-card">
                                        <div class="approved-avatar">
                                            <i class="fa-solid fa-microphone"></i>
                                        </div>

                                        <div class="approved-info">
                                            <h2>${item.nome_artista} <i class="fa-solid fa-circle-check"></i></h2>
                                            <span>${item.genero || 'Gênero não informado'}</span>
                                            <span>Sugerido por ${item.criador || 'Equipe'}</span>
                                        </div>

                                        <div class="approved-metrics">
                                            <div class="approved-metric">
                                                <small>Popularidade</small>
                                                <strong>${item.popularidade || 0}</strong>
                                            </div>

                                            <div class="approved-metric">
                                                <small>Energy</small>
                                                <strong>${item.energy || '0.00'}</strong>
                                            </div>

                                            <div class="approved-metric">
                                                <small>Danceability</small>
                                                <strong>${item.danceability || '0.00'}</strong>
                                            </div>

                                            <div class="approved-metric">
                                                <small>BPM</small>
                                                <strong>${item.bpm || 0}</strong>
                                            </div>
                                        </div>

                                        <div class="approved-status">
                                            <i class="fa-solid fa-check"></i>
                                            Aprovado
                                        </div>

                                        <button class="approved-button" data-nome="${item.nome_artista}" onclick="verAnalise(this)">
                                            Ver análise
                                            <i class="fa-solid fa-arrow-right"></i>
                                        </button>
                                    </article>
                                `;
                            });
                        });
                    } else {
                        console.error("Erro ao carregar os dados dos artistas aprovados.");
                    }
                })
                .catch(function (erro) {
                    console.error("Erro de conexão com o servidor: ", erro);
                });
        }

        function verAnalise(botao) {
            var nomeArtista = botao.getAttribute("data-nome");
            window.location.href = `pesquisa.html?nome=${encodeURIComponent(nomeArtista)}`;
        }
    </script>
</body>

</html>
