<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sonora. | CADASTRO</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/home/header-footer.css">
    <link rel="stylesheet" href="./css/home/cadastro.css">
    
    <link rel="icon" href="assets/logos-sonora/play-icon.png">
</head>

<body>

    <!-- Header / Navbar -->
    <header class="header">
        <div class="container header-container">
            <h1 class="logo">sonora.</h1>
            <nav>
                <ul class="navbar">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="index.html">MISSÃO</a></li>
                    <li><a href="index.html">CONTATO</a></li>
                    <li><a href="cadastro.html"  class="ativo">CADASTRO</a></li>
                    <li><a href="login.html">LOGIN</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="secao-cadastro">
        <div class="cadastro-esquerda">
            <img src="assets/icons-sonora/disco-cortado-direita.png" alt="Disco" class="img-disco-direita">
            
            <div class="container-formulario">
                <h2 class="titulo-cadastro">CADASTRO</h2>
                
                <div class="alerta_erro">
                    <div class="card_erro" id="cardErro">
                        <span id="mensagem_erro"></span>
                    </div>
                </div>

                <input id="cnpj_input" type="text" placeholder="CNPJ" class="input-escuro" />
                <input id="nome_empresa_input" type="text" placeholder="nome da empresa" class="input-escuro" />
                <select id="tipo_empresa_input" class="input-escuro">
                    <option value="" selected disabled>Selecione o tipo de estabelecimento</option>
                    <option value="restaurante">Restaurante</option>
                    <option value="casa_show">Casa de Show</option>
                    <option value="balada">Balada</option>
                    <option value="bar">Bar</option>
                </select>
                <input id="email_input" type="email" placeholder="e-mail" class="input-escuro" />
                
                <div class="wrapper-senha">
                    <input id="senha_input" type="password" placeholder="senha" class="input-escuro" />
                </div>

                <div class="wrapper-senha">
                    <input id="confirmacao_senha_input" type="password" placeholder="confirmação da senha" class="input-escuro" />
                </div>
                
                <button onclick="cadastrar()" class="btn-cadastrar">CADASTRAR</button>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif" />
                </div>
        
                <div id="div_erros_login"></div>

                <span class="texto-login">Já tem conta? <a href="login.html">CLIQUE AQUI</a></span>
            </div>
        </div>

        <div class="cadastro-direita">
            <div class="conteudo-direita">
                <h1 class="logo-cadastro">sonora.</h1>
                <div class="player-widget">
                    <img src="assets/logos-sonora/barra-branca.png" alt="Barra de Progresso" class="img-progress-bar">
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-container">
            
            <div class="footer-info">
                <p><img src="assets/icons-sonora/local-icon.png" alt="Endereço" class="icon-footer"> Rua Hadock Lobo</p>
                <p><img src="assets/icons-sonora/telefone-icon.png" alt="Telefone" class="icon-footer"> (11) 99999-9999</p>
                <p><img src="assets/icons-sonora/rede-icon.png" alt="Website" class="icon-footer"> www.sonora.com.br</p>
                <p><img src="assets/icons-sonora/email-icon.png" alt="E-mail" class="icon-footer"> sonora@gmail.com</p>
            </div>

            <div class="footer-logo">
                <h2>sonora.</h2>
                <div class="player-widget-sm">
                    <img src="assets\logos-sonora\barra-preta.png" alt="Barra de Progresso Pequena" class="img-progress-bar-sm">
                </div>
            </div>

            <div class="footer-decoracao">
                <img src="assets/icons-sonora/elemento-icon.png" alt="Textura Sonora" class="img-textura-footer">
            </div>

        </div>
    </footer>
</body>

</html>

<script>

  function cadastrar() {
    
    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    let cnpj = cnpj_input.value;
    let nome = nome_empresa_input.value;
    let tipo = tipo_empresa_input.value;
    let email = email_input.value;
    let senha = senha_input.value;
    let confirmacaoSenha = confirmacao_senha_input.value;

    // Verificações

    // campo em branco
    if (
      cnpj == "" ||
      nome == "" ||
      tipo == "" ||
      email == "" ||
      senha == "" ||
      confirmacaoSenha == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Preencha todos os campos!)";
      return null;
    }

    // campo senha e confirmação de senha
    if (senha != confirmacaoSenha) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(As senhas não coincidem!)";
      return null;
    }

    fetch("/empresas/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        cnpjServer: cnpj,
        nomeServer: nome,
        tipoServer: tipo,
        emailServer: email,
        senhaServer: senha
      }),
    })
      .then(function (resposta) {
        console.log("Log: Estou na tela de cadastro na função cadastrar, resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`Log Error: Estou na tela de cadastro na função cadastrar e houve um erro: ${resposta}`);
      });
  }

</script>
