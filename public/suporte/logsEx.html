<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs | Sonora</title>
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/suporte/logs.css">
</head>

<body>

    <aside class="box-menu">
        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <div class="menu-top">
            <label for="menu-toggle" class="btn-hamburguer">
                <i class="fa-solid fa-bars"></i>
            </label>
            <p class="logo">sonora.</p>
        </div>

        <ul class="lista">
            <li><a href="logs.html"><i class="fa-solid fa-house"></i>Início</a></li>
            <li class="ativo"><a href="logsEx.html"><i class="fa-solid fa-clipboard-list"></i>Logs</a></li>
            <li><a href="monitoramento.html"><i class="fa-solid fa-heart-pulse" aria-hidden="true"></i>Monitoramento</a></li>
            <li><a href="perfil.html"><i class="fa-solid fa-user"></i>Perfil</a></li>

            <li class="box-sair">
                <a class="botao-sair" href="../index.html"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </li>
        </ul>
    </aside>

    <main class="conteudo-principal">

        <header class="cabecalho-pagina">
            <div class="cabecalho-info">
                <span class="sobretitulo">SONORA / LOGS</span>
                <h1>Logs</h1>
                <p>
                    Consulte todas as ocorrências registradas e filtre por tipo ou status.
                </p>
            </div>
        </header>

        <section class="cartao-filtros">
            <h3><i class="fa-solid fa-filter"></i> Filtros</h3>

            <div class="grade-filtros">

                <div class="campo-filtro">
                    <label for="filtro-tipo">Tipo</label>

                    <select id="filtro-tipo">
                        <option value="">Todos</option>
                        <option value="Falha">Falha</option>
                        <option value="Atraso">Atraso</option>
                        <option value="Sistema">Sistema</option>
                        <option value="Integração">Integração</option>
                    </select>
                </div>

                <div class="campo-filtro">
                    <label for="filtro-status">Status</label>

                    <select id="filtro-status">
                        <option value="">Todos</option>
                        <option value="Crítico">Crítico</option>
                        <option value="Atenção">Atenção</option>
                        <option value="Em análise">Em análise</option>
                        <option value="Informação">Informação</option>
                        <option value="Resolvido">Resolvido</option>
                    </select>
                </div>

                <div class="acoes-filtro">
                    <button type="button" class="botao-limpar" id="botao-limpar">
                        <i class="fa-solid fa-eraser"></i> Limpar
                    </button>
                </div>

            </div>
        </section>

        <section class="cartao">
            <div class="cartao-cabecalho">
                <h3><i class="fa-solid fa-clipboard-list"></i> Ocorrências</h3>
                <span class="contador-registros" id="contador">0 registros</span>
            </div>

            <div class="tabela-rolagem">
                <table class="tabela-ocorrencias">
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Tipo</th>
                            <th>Mensagem</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-logs"></tbody>
                </table>
            </div>

            <p class="mensagem-vazia" id="mensagem-vazia" hidden>
                Nenhuma ocorrência encontrada com esses filtros.
            </p>
        </section>

    </main>

    <script>
        let ocorrencias = [];

        const filtroTipo =
            document.getElementById("filtro-tipo");

        const filtroStatus =
            document.getElementById("filtro-status");

        const botaoLimpar =
            document.getElementById("botao-limpar");

        const corpoTabela =
            document.getElementById("tabela-logs");

        const contador =
            document.getElementById("contador");

        const mensagemVazia =
            document.getElementById("mensagem-vazia");

        document.addEventListener(
            "DOMContentLoaded",
            carregarLogs
        );

        async function carregarLogs() {
            try {
                const resposta =
                    await fetch("/suporte/listar");

                if (!resposta.ok) {
                    throw new Error(
                        "Erro ao carregar os logs."
                    );
                }

                ocorrencias =
                    await resposta.json();

                mostrarOcorrencias();

            } catch (erro) {
                console.error(
                    "Erro ao carregar logs:",
                    erro
                );

                corpoTabela.innerHTML = "";

                mensagemVazia.hidden = false;
                mensagemVazia.textContent =
                    "Não foi possível carregar os logs.";
            }
        }

        function classeStatus(status) {
            if (
                status === "Crítico" ||
                status === "Falha"
            ) {
                return "status-critico";
            }

            if (
                status === "Atenção" ||
                status === "Em análise"
            ) {
                return "status-atencao";
            }

            return "status-resolvido";
        }

        function formatarDataHora(dataHora) {
            const data =
                new Date(dataHora);

            return (
                data.toLocaleDateString(
                    "pt-BR"
                ) +
                " " +
                data.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                )
            );
        }

        function mostrarOcorrencias() {
            const lista =
                ocorrencias.filter(function (item) {
                    const tipoOk =
                        !filtroTipo.value ||
                        item.tipo === filtroTipo.value;

                    const statusOk =
                        !filtroStatus.value ||
                        item.status === filtroStatus.value;

                    return tipoOk && statusOk;
                });

            corpoTabela.innerHTML = "";

            lista.forEach(function (item) {
                const linha =
                    document.createElement("tr");

                const colunaData =
                    document.createElement("td");

                colunaData.textContent =
                    formatarDataHora(
                        item.data_hora
                    );

                const colunaTipo =
                    document.createElement("td");

                colunaTipo.textContent =
                    item.tipo;

                const colunaMensagem =
                    document.createElement("td");

                colunaMensagem.textContent =
                    item.mensagem;

                const colunaStatus =
                    document.createElement("td");

                const selo =
                    document.createElement("span");

                selo.classList.add(
                    "selo-status",
                    classeStatus(item.status)
                );

                selo.textContent =
                    item.status;

                colunaStatus.appendChild(
                    selo
                );

                linha.append(
                    colunaData,
                    colunaTipo,
                    colunaMensagem,
                    colunaStatus
                );

                corpoTabela.appendChild(
                    linha
                );
            });

            contador.textContent =
                lista.length === 1
                    ? "1 registro"
                    : lista.length + " registros";

            mensagemVazia.hidden =
                lista.length > 0;
        }

        filtroTipo.addEventListener(
            "change",
            mostrarOcorrencias
        );

        filtroStatus.addEventListener(
            "change",
            mostrarOcorrencias
        );

        botaoLimpar.addEventListener(
            "click",
            function () {
                filtroTipo.value = "";
                filtroStatus.value = "";

                mostrarOcorrencias();
            }
        );
    </script>

</body>

</html>
