<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Empresa | Sonora</title>
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/empresa/perfil.css">
</head>

<body>

    <aside class="box-menu">
        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <div class="menu-top">
            <label for="menu-toggle" class="btn-hamburguer">
                <i class="fa-solid fa-bars"></i>
            </label>
            <p class="logo">sonora.</p>
        </div>

        <ul class="lista">

            <li class="ativo"><a href="dashboard.html"><i class="fa-solid fa-house"></i>Início</a></li>
            <li><a href="pesquisaArtista.html"><i class="fa-solid fa-magnifying-glass"></i>Artistas</a></li>

            <li><a href="cadastroFuncionario.html"><i class="fa-solid fa-users"></i>Funcionários</a></li>
            <li><a href="aprovados.html"><i class="fa-solid fa-user-pen"></i>Aprovados</a></li>
            <li><a href="gerenciamentoEventos.html"><i class="fa-solid fa-music"></i>Eventos</a></li>
            <li><a href="notificacoes.html"><i class="fa-solid fa-bell"></i>Notificações</a></li>
            <li><a href="preferencia.html"><i class="fa-solid fa-sliders"></i>Preferências</a></li>
            <li><a href="perfilEmpresa.html"><i class="fa-solid fa-building"></i>Perfil Empresa</a></li>
            <li><a href="perfil.html"><i class="fa-solid fa-user"></i>Perfil</a></li>

            <li class="box-sair">
                <a class="botao-sair" href="../index.html"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="cabecalho-pagina">
            <div class="cabecalho-info">
                <span class="sobretitulo">SONORA / PERFIL DA EMPRESA</span>

                <h1>Perfil da empresa</h1>

                <p>
                    Consulte e atualize os dados cadastrais da sua empresa.
                </p>
            </div>
        </header>

        <div class="profile-container">
            <section class="profile-card">

                <form class="profile-form" id="formulario-perfil">

                    <div class="field-group">
                        <label for="ipt_nome_empresa"><i class="fa-solid fa-font"></i> Razão Social</label>
                        <input type="text" id="ipt_nome_empresa" placeholder="Nome da empresa" required>
                    </div>

                    <div class="field-group">
                        <label for="ipt_cnpj_empresa"><i class="fa-solid fa-id-card"></i> CNPJ</label>
                        <input type="text" id="ipt_cnpj_empresa" placeholder="00.000.000/0000-00" required>
                    </div>

                    <div class="field-group">
                        <label for="select_tipo_empresa"><i class="fa-solid fa-store"></i> Tipo de
                            Estabelecimento</label>
                        <select id="select_tipo_empresa" required>
                            <option value="">Selecione</option>
                            <option value="1">Casa de Shows</option>
                            <option value="2">Boate</option>
                            <option value="3">Bar</option>
                            <option value="4">Teatro</option>
                            <option value="5">Centro Cultural</option>
                            <option value="6">Festival</option>
                            <option value="7">Arena</option>
                            <option value="8">Restaurante</option>
                            <option value="9">Pub</option>
                            <option value="10">Clube</option>
                            <option value="11">Outro</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <i class="fa-solid fa-floppy-disk"></i> Salvar
                        </button>
                        <button type="button" class="btn-danger" id="btn-excluir-conta">
                            <i class="fa-solid fa-trash-can"></i> Excluir
                        </button>
                    </div>

                </form>

            </section>
        </div>

    </main>

    <script>
        const idEmpresa = sessionStorage.ID_EMPRESA || sessionStorage.id_empresa;

        async function registrarLog(tipo, mensagem, status) {
            try {
                await fetch("/suporte/registrar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        tipo: tipo,
                        mensagem: mensagem,
                        status: status
                    })
                });
            } catch (erro) {
                console.error("Erro ao registrar log:", erro);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (!idEmpresa) {
                alert("Houve um erro ao tentar identificar seu usuário, realize o login novamente");
                window.location.href = "../index.html";
                return;
            }

            carregarDadosEmpresa();

            // Evento de submit do formulário de atualização
            document.getElementById("formulario-perfil").addEventListener("submit", salvarEmpresa);

            // Evento para excluir a conta da empresa
            document.getElementById("btn-excluir-conta").addEventListener("click", excluirEmpresa);
        });

        function carregarDadosEmpresa() {
            const inicioRequisicao = performance.now();

            fetch(`/empresa/buscar/${idEmpresa}`)
                .then(resposta => {

                    const tempoResposta =
                        performance.now() - inicioRequisicao;

                    if (tempoResposta > 3000) {
                        registrarLog(
                            "Atraso",
                            "Consulta dos dados da empresa demorou " +
                            Math.round(tempoResposta) +
                            "ms para responder.",
                            "Atenção"
                        );
                    }

                    if (resposta.ok) {
                        return resposta.json();
                    }

                    registrarLog(
                        "Falha",
                        "Não foi possível carregar os dados da empresa.",
                        "Crítico"
                    );

                    throw new Error("Erro ao carregar dados da empresa");
                })
                .then(dadosEmpresa => {

                    registrarLog(
                        "Sistema",
                        "Dados da empresa carregados com sucesso.",
                        "Informação"
                    );

                    if (dadosEmpresa) {
                        document.getElementById("ipt_nome_empresa").value = dadosEmpresa.razao_social || "";
                        document.getElementById("ipt_cnpj_empresa").value = dadosEmpresa.cnpj || "";
                        document.getElementById("select_tipo_empresa").value = dadosEmpresa.id_tipo_estabelecimento || "";
                    }
                })
                .catch(erro => {
                    console.error("Erro na requisição: ", erro);

                    if (erro.message !== "Erro ao carregar dados da empresa") {
                        registrarLog(
                            "Integração",
                            "Falha na comunicação ao carregar os dados da empresa.",
                            "Crítico"
                        );
                    }
                });
        }

        function salvarEmpresa(event) {
            event.preventDefault();

            const razaoSocial = document.getElementById("ipt_nome_empresa").value.trim();
            const cnpj = document.getElementById("ipt_cnpj_empresa").value.trim();
            const tipoEstabelecimento = document.getElementById("select_tipo_empresa").value;

            if (!razaoSocial || !cnpj || !tipoEstabelecimento) {
                alert('Preencha todos os campos!');
                return;
            }

            const inicioRequisicao = performance.now();

            fetch(`/empresa/atualizar/${idEmpresa}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    razaoSocial: razaoSocial,
                    cnpj: cnpj,
                    idTipoEstabelecimento: Number(tipoEstabelecimento)
                })
            })
                .then(resposta => {

                    const tempoResposta =
                        performance.now() - inicioRequisicao;

                    if (tempoResposta > 3000) {
                        registrarLog(
                            "Atraso",
                            "Atualização do perfil da empresa demorou " +
                            Math.round(tempoResposta) +
                            "ms para responder. Empresa: " +
                            razaoSocial,
                            "Atenção"
                        );
                    }

                    if (resposta.ok) {

                        registrarLog(
                            "Sistema",
                            "Perfil da empresa atualizado com sucesso. Empresa: " +
                            razaoSocial,
                            "Informação"
                        );

                        alert('Dados atualizados com sucesso!');

                    } else {

                        registrarLog(
                            "Falha",
                            "Não foi possível atualizar o perfil da empresa. Empresa: " +
                            razaoSocial,
                            "Crítico"
                        );

                        throw new Error("Erro ao atualizar perfil da empresa");
                    }
                })
                .catch(erro => {
                    console.error("Erro: ", erro);

                    if (erro.message !== "Erro ao atualizar perfil da empresa") {
                        registrarLog(
                            "Integração",
                            "Falha na comunicação ao atualizar o perfil da empresa.",
                            "Crítico"
                        );
                    }

                    alert("Erro ao atualizar dados.");
                });
        }

        function excluirEmpresa() {
            if (confirm("Tem certeza que deseja excluir sua empresa? Esta ação não poderá ser desfeita.")) {

                const inicioRequisicao = performance.now();

                fetch(`/empresa/deletar/${idEmpresa}`, {
                    method: "DELETE"
                })
                    .then(resposta => {

                        const tempoResposta =
                            performance.now() - inicioRequisicao;

                        if (tempoResposta > 3000) {
                            registrarLog(
                                "Atraso",
                                "Exclusão da empresa demorou " +
                                Math.round(tempoResposta) +
                                "ms para responder.",
                                "Atenção"
                            );
                        }

                        if (resposta.ok) {

                            registrarLog(
                                "Sistema",
                                "Empresa excluída com sucesso.",
                                "Informação"
                            );

                            alert("Conta excluída com sucesso.");
                            sessionStorage.clear();
                            window.location.href = "../index.html";

                        } else {

                            registrarLog(
                                "Falha",
                                "Não foi possível excluir a empresa.",
                                "Crítico"
                            );

                            throw new Error("Erro ao excluir conta");
                        }
                    })
                    .catch(erro => {
                        console.error("Erro: ", erro);

                        if (erro.message !== "Erro ao excluir conta") {
                            registrarLog(
                                "Integração",
                                "Falha na comunicação ao excluir a empresa.",
                                "Crítico"
                            );
                        }

                        alert("Não foi possível excluir a conta.");
                    });
            }
        }
    </script>

</body>

</html>
